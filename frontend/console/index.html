<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>EvoQuantAAA Console</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="atmosphere" aria-hidden="true"></div>
  <header class="hero">
    <p class="brand">EvoQuantAAA</p>
    <h1>生产只读台</h1>
    <p class="lede">经 api_gateway 查看策略、Kill Switch、组合与账本。不直连数据库。</p>
  </header>

  <section class="config" aria-label="连接">
    <label>API Base
      <input id="apiBase" type="url" value="http://127.0.0.1:8080" />
    </label>
    <label>Bearer Token（可选）
      <input id="apiToken" type="password" placeholder="ASHARE_API_TOKEN" autocomplete="off" />
    </label>
    <button type="button" id="btnRefresh" class="cta">刷新全部</button>
    <p id="statusLine" class="status" role="status">尚未连接</p>
  </section>

  <main>
    <section>
      <h2>Kill Switch</h2>
      <pre id="killBox" class="pane">—</pre>
    </section>
    <section>
      <h2>LIVE / PAPER 策略</h2>
      <pre id="stratBox" class="pane">—</pre>
    </section>
    <section>
      <h2>最近组合</h2>
      <pre id="pfBox" class="pane">—</pre>
    </section>
    <section>
      <h2>账本 paper_default</h2>
      <pre id="ledgerBox" class="pane">—</pre>
    </section>
    <section>
      <h2>告警</h2>
      <pre id="alertBox" class="pane">—</pre>
    </section>
  </main>

  <footer>
    <p>启动网关：<code>cd backend && python main.py gateway --port 8080</code></p>
    <p>本页：<code>cd frontend/console && python -m http.server 8081</code> → http://127.0.0.1:8081</p>
  </footer>
  <script src="./app.js"></script>
</body>
</html>
